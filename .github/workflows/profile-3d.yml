name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: mohamadrezarajabi
      - name: Commit & Push
        run: |
          git config user.name "mohamadrezarajabi"
          git config user.email "mohamadrezarajabi87@gmail.com"
          git add -A .
          if git commit -m "generate 3d contrib"; then
            git push
          fi
